# Four profiles, four commands (see README):
#   docker compose --profile core --profile mocks up -d
#   go test ./...
#   docker compose --profile testing run k6
#   docker compose --profile core --profile mocks --profile observability up -d
# Not TDD'd (IMPLEMENTATION_PLAN.md ground rule 4) - compose wiring is
# infrastructure, not behavior a test proves.
services:
  mocksf:
    build:
      context: .
      target: mocksf
    profiles: ["mocks"]
    ports:
      - "8081:8081"
    # SF_LATENCY_* inject real-ish connector latency (assumption A4). Default 0
    # keeps the quickstart instant; set them to measure latency/concurrency,
    # where a ~1 ms mock makes L = lambda x W collapse to ~1 in flight.
    command: ["--rows", "2000", "--page-size", "500",
              "--latency-min", "${SF_LATENCY_MIN:-0}", "--latency-max", "${SF_LATENCY_MAX:-0}"]

  mockzd:
    build:
      context: .
      target: mockzd
    profiles: ["mocks"]
    ports:
      - "8082:8082"
    command: ["--tickets", "50000",
              "--delay", "${ZD_LATENCY_MIN:-0}", "--latency-max", "${ZD_LATENCY_MAX:-0}"]

  gateway:
    build:
      context: .
      target: gateway
    profiles: ["core"]
    ports:
      - "8080:8080"
    # --otlp-endpoint always points at jaeger, even when the observability
    # profile isn't running - the exporter connects lazily (see
    # obs.InitTracing), so an absent jaeger just means periodic background
    # export-failure log lines, never a startup failure or blocked request.
    command: ["--sf-url", "http://mocksf:8081", "--zd-url", "http://mockzd:8082", "--otlp-endpoint", "jaeger:4318"]

  # ADR-007 tier 1's real engine. A separate service rather than a flag on the
  # one above, because the DuckDB build is cgo and needs a different base
  # image - so `--profile core` stays a static binary and you opt into cgo by
  # naming this profile. Runs on 8090 so both can be up at once and the same
  # query can be sent to each.
  gateway-duckdb:
    build:
      context: .
      target: gateway-duckdb
    profiles: ["duckdb"]
    ports:
      - "8090:8090"
    command: ["--addr", ":8090", "--sf-url", "http://mocksf:8081", "--zd-url", "http://mockzd:8082",
              "--join-engine", "duckdb", "--join-memory-limit", "256MB", "--join-threads", "1",
              "--otlp-endpoint", "jaeger:4318"]

  k6:
    image: grafana/k6:latest
    profiles: ["testing"]
    volumes:
      - ./k6:/scripts:ro
    entrypoint: ["k6", "run", "-e", "BASE_URL=http://gateway:8080", "/scripts/load.js"]

  # Jaeger's all-in-one image accepts OTLP/HTTP directly (port 4318) and
  # serves the trace UI on 16686 - no separate OTel Collector needed for a
  # single gateway instance.
  jaeger:
    image: jaegertracing/all-in-one:latest
    profiles: ["observability"]
    ports:
      - "16686:16686" # UI - open this and search by trace_id
      - "4318:4318"   # OTLP/HTTP receiver
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  # Scrapes the gateway's real /metrics endpoint (internal/server.go) -
  # visit http://localhost:9090/graph and query
  # connector_request_duration_seconds.
  prometheus:
    image: prom/prometheus:latest
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
